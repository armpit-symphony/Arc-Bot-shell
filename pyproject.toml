[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-bot-shell"
version = "0.1.0"
description = "Arc Harness Shell release candidate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lima-runtime @ git+https://github.com/armpit-symphony/LIMA-AI-OS.git@0463b6963f0d5cb9a3af9a6f323dfd847594d546",
]

[project.scripts]
arc-harness = "arc_bot_shell.harness.__main__:main"
arc-console = "arc_bot_shell.console.commands:main"
arc-health = "arc_bot_shell.health:main"

[tool.setuptools.packages.find]
include = ["arc_bot_shell*", "arc_guardian_spine*"]
