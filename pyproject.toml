[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-bot-shell"
version = "0.1.0"
description = "Arc Harness Shell release candidate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lima-runtime @ git+https://github.com/armpit-symphony/LIMA-AI-OS.git@4a599405961e786808ea7a7da71ecc65f7358e4f",
]

[project.scripts]
arc-harness = "arc_bot_shell.harness.__main__:main"
arc-console = "arc_bot_shell.console.commands:main"
arc-health = "arc_bot_shell.health:main"
arc-worker-preview = "arc_bot_shell.control_plane.cli:main"
arc-preflight = "arc_bot_shell.control_plane.operator_cli:main"
arc-workers = "arc_bot_shell.control_plane.worker_inventory_cli:main"
arc-evidence = "arc_bot_shell.control_plane.evidence_cli:main"

[tool.setuptools.packages.find]
include = ["arc_bot_shell*", "arc_guardian_spine*"]
